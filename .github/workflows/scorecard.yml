# Scorecard: a diagnosis of where the football looks unrealistic and where a
# change moved it. It never fails a PR; reviewers read it beside the
# mechanism's own evidence (docs/PLAN.md). It costs about ten Actions minutes,
# so it runs only on PRs labelled `scorecard` that change engine code, at the
# cheap PR tier; run the full tier by hand for big fixes.
name: scorecard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['src/**', 'scripts/scorecard/**']
  workflow_dispatch:
    inputs:
      tier:
        description: quick, pr or full
        default: pr

# A new push to the same PR cancels the run still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scorecard')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/setup-node@v4
        with:
          node-version-file: head/.nvmrc
          cache: npm
          cache-dependency-path: head/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: head
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Base, on the same games
        if: github.event_name == 'pull_request'
        run: |
          # The base may predate the scorecard; use this PR's copy of it.
          rm -rf base/scripts/scorecard && cp -r head/scripts/scorecard base/scripts/
          cd base && npm ci --no-audit --no-fund
          node --import tsx scripts/scorecard/run.ts --tier pr --out ../out/base.json > /dev/null
      - name: This change
        working-directory: head
        run: |
          if [ -f ../out/base.json ]; then cmp="--compare ../out/base.json"; else cmp=""; fi
          node --import tsx scripts/scorecard/run.ts --tier "${{ inputs.tier || 'pr' }}" $cmp --out ../out/head.json --md ../out/scorecard.md > /dev/null
      - name: Publish
        run: cat out/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: out/

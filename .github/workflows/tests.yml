name: tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.*'
      - '.nvmrc'
      - '.github/workflows/tests.yml'
  push:
    branches: [develop]
  workflow_dispatch:

# A new push to the same PR cancels the run still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: core
            script: test
          - project: integration
            script: test:integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
        if: matrix.project == 'core'
      - run: npm run build
        if: matrix.project == 'core'
      # Matrix jobs use separate runners. The existing integration script
      # keeps its CPU-heavy native games serial with --maxWorkers=1.
      - run: npm run ${{ matrix.script }}

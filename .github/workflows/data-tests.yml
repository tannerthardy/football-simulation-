name: offline data tests

on:
  # Draft PRs skip CI; marking a PR ready for review runs it. Agents run
  # these same checks locally while a PR is a draft.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/poetry.lock'
      - '**/uv.lock'
      - '.nvmrc'
      - '.github/workflows/data-tests.yml'
  workflow_dispatch:

# A new push to the same PR cancels the run still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  data:
    name: offline data
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/data/requirements-movement.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install declared test dependencies
        run: |
          python3 -m pip install -r scripts/data/requirements-movement.txt
          npm ci --no-audit --no-fund
      - name: Show runtime and dependency versions
        run: |
          python3 --version
          node --version
          python3 -c 'import numpy, pandas; print(f"NumPy {numpy.__version__}; pandas {pandas.__version__}")'
      # Discover every test_*.py, including mechanics-guard and future
      # measurement fixtures. Import failures and failed tests fail the job.
      # These use offline fixtures; do not fetch NFL data or simulate games.
      - name: Run discovered offline tests
        run: npm run test:data -- --verbose
